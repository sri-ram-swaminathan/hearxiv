[project]
name = "hearxiv"
version = "0.1.0"
description = "Free, open-source, voice-first interactive reader for arXiv papers, built for blind and low-vision researchers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.59.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Cloud figure description via Gemini (free tier)
gemini = ["google-genai>=3.6.1"]
# Local, zero-cost figure description on CPU/GPU
local = [
    "torch>=2.10",
    "torchvision",
    "transformers>=5",
    "accelerate",
    "huggingface_hub",
]
# On-device text-to-speech (Gradium Phonon, 31M params, Apache-2.0)
tts = [
    "ptts",
]
svg = [
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "google-genai>=3.6.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "num2words",
    "pandas>=3.1.1",
    "pytest",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.10",
    "torchvision",
    "transformers>=5",
    "accelerate",
    "huggingface_hub",
    "ptts>=0.7.1",
    "pymupdf>=2.1",
]

[project.scripts]
hearxiv = "hearxiv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearxiv"]

[tool.uv]
# Prefer signed system Pythons: Windows Smart App Control can block DLLs in uv-managed builds.
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]
